<!DOCTYPE html><html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>考古学家 — 敦煌复苏计划</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<video id="camera-video" autoplay playsinline muted></video>
<div class="cam-overlay"></div>
<div class="fade-overlay" id="fade-overlay"></div>

<!-- PERM -->
<div id="scene-perm" class="scene active" style="background:var(--cave-bg)">
  <div class="perm-screen">
    <div class="perm-icon">🔦</div>
    <div class="perm-title">敦煌复苏计划</div>
    <div class="perm-desc">
      你即将进入一个即将坍塌的洞窟。<br>游戏需要使用<strong>摄像头</strong>和<strong>运动传感器</strong>。<br>请在弹出的权限请求中点击"允许"。
    </div>
    <div class="perm-desc" style="color:var(--gold-light);font-size:12px">身份：考古学家</div>
    <button class="btn btn-arch" id="perm-btn">授权并开始</button>
    <div style="font-size:10px;opacity:.3;flex-basis:100%;text-align:center">摄像头画面仅在设备本地使用，不会上传</div>
  </div>
</div>

<!-- WALL SCAN -->
<div id="scene-wall-scan" class="scene">
  <div class="scan-frame">
    <div class="scan-corners">
      <div class="scan-corner-bl"></div><div class="scan-corner-br"></div>
      <div class="scan-line"></div>
    </div>
  </div>
  <div class="scan-label arch" id="scan-label">将摄像头对准附近的岩壁……</div>
  <button class="btn btn-arch scan-tap-btn" id="scan-tap-btn">▶ 锚定此处，开始开凿</button>
</div>

<!-- EXCAVATION -->
<div id="scene-excavation" class="scene">
  <canvas id="game-canvas" class="hidden"></canvas>
  <div class="hud" id="ex-hud" style="display:none">
    <div class="hud-label" style="color:var(--gold-light)">开凿进度</div>
    <div id="ex-score" style="font-weight:700;color:var(--gold);font-size:15px">0/12</div>
  </div>
  <div class="force-wrap" id="force-wrap" style="display:none">
    <div class="force-label">力度</div>
    <div class="force-bar-outer"><div class="force-bar-inner" id="force-bar" style="height:50%"></div><div class="force-ideal-line"></div></div>
    <div class="force-label">↑重</div>
  </div>
  <div id="ex-feedback" style="position:fixed;top:32%;left:0;right:0;text-align:center;font-size:16px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;text-shadow:0 0 12px var(--gold-glow)"></div>
  <div style="position:fixed;bottom:4%;left:0;right:0;text-align:center;font-size:10px;opacity:.35;z-index:50;pointer-events:none">点击对应区域开凿 · 注意时机与力度</div>
</div>

<!-- CLUE CATCH -->
<div id="scene-clue-catch" class="scene">
  <div style="position:fixed;inset:0;background:rgba(0,0,0,0.4);pointer-events:none;z-index:5"></div>
  <div class="clue-score"><span id="cc-score">线索 0/2</span> <span style="margin-left:6px;opacity:.5" id="cc-timer">18s</span></div>
  <div style="position:fixed;top:40px;left:0;right:0;text-align:center;font-size:10px;opacity:.4;z-index:70;pointer-events:none">点击金色线索 · 忽略红色乱码</div>
</div>

<!-- COUNTDOWN -->
<div id="scene-countdown-reveal" class="scene" style="background:rgba(0,0,0,0.9)"></div>

<!-- CAVE EXPLORE -->
<div id="scene-cave-explore" class="scene">
  <div class="cave-deco-layer"></div>
  <div style="position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(200,100,10,0.06) 0%,rgba(0,0,0,0.7) 65%);pointer-events:none;z-index:7"></div>
  <div id="cave-area" style="position:fixed;inset:0;z-index:8;touch-action:none"></div>
  <div class="timer-badge arch" id="timer-badge" style="display:none">0:00</div>
  <div class="viewfinder" id="viewfinder"><div class="viewfinder-cross"></div></div>
  <div class="artifact-hint" id="artifact-hint"></div>
  <div class="compass-bar" id="compass-bar">
    <div class="artifact-markers" id="art-markers">
      <div class="art-marker" data-name="壁画" style="left:5%"></div>
      <div class="art-marker" data-name="经书" style="left:23%"></div>
      <div class="art-marker" data-name="大佛像" style="left:45%"></div>
      <div class="art-marker" data-name="小佛像" style="left:73%"></div>
    </div>
    <div class="compass-dot" id="compass-dot" style="left:0%"></div>
  </div>
  <div style="position:fixed;bottom:4%;left:0;right:0;text-align:center;font-size:10px;opacity:.3;z-index:20;pointer-events:none">转动手机或拖动屏幕 · 寻找文物</div>
  <div id="minigame-wrap" class="minigame-wrap" style="display:none"></div>
</div>

<!-- ENDING -->
<div id="scene-ending" class="scene" style="background:var(--cave-bg)"></div>
<!-- RESULTS -->
<div id="scene-results" class="scene" style="background:var(--cave-bg);overflow-y:auto"></div>

<script src="js/shared.js"></script>
<script src="js/archaeologist.js"></script>
</body>
</html>
