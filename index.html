<!DOCTYPE html><html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>敦煌复苏计划</title>
<link rel="stylesheet" href="css/style.css">
<style>
body { overflow:hidden; background:#000; }
.index-bg {
  position:fixed; inset:0;
  background:radial-gradient(ellipse at 50% 60%,#1f0d00 0%,#0a0510 55%,#000 100%);
}
canvas#particles { position:fixed; inset:0; z-index:1; pointer-events:none; }
.loading-overlay { z-index:300; }
.loading-subtitle { font-size:11px; opacity:0.4; letter-spacing:0.2em; margin-top:8px; }
.loading-tip { font-size:10px; opacity:0.3; margin-top:28px; }
</style>
</head>
<body>
<div class="index-bg"></div>
<canvas id="particles"></canvas>

<!-- Loading -->
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-title">敦煌复苏计划</div>
  <div class="loading-subtitle">DUNHUANG DIGITAL REVIVAL PROJECT</div>
  <div class="loading-progress-wrap">
    <div class="loading-walker" id="loading-walker">🚶</div>
    <div class="loading-progress-bar" id="loading-bar" style="width:0%"></div>
  </div>
  <div class="loading-tip" id="loading-tip">正在启动数字敦煌系统……</div>
</div>

<!-- Content (shown after loading) -->
<div class="index-content" id="index-content" style="display:none">
  <div class="game-title-img">
    <div class="game-title-text">敦煌复苏计划</div>
    <div style="font-size:10px;opacity:0.35;letter-spacing:0.12em;">DUNHUANG DIGITAL REVIVAL PROJECT</div>
  </div>

  <div style="font-size:11px;opacity:0.45;font-style:italic;text-align:center;line-height:1.5;flex-basis:100%;margin-bottom:10px">
    "在失忆的时代，选择记住什么，是一种反抗。"
  </div>

  <div class="char-cards">
    <div class="char-card arch-card" id="card-arch" onclick="selectChar('arch')">
      <div class="char-icon">🔨</div>
      <div class="char-name arch">考古学家</div>
      <div class="char-tag arch-tag">现场探索</div>
      <div class="char-traits">稳重踏实·亲历洞窟<br>文物还原度↑</div>
    </div>
    <div class="char-card prog-card" id="card-prog" onclick="selectChar('prog')">
      <div class="char-icon">💻</div>
      <div class="char-name prog">程序员</div>
      <div class="char-tag prog-tag">远程协作</div>
      <div class="char-traits">聪明急躁·数据支援<br>数字修复↑</div>
    </div>
  </div>

  <div class="start-btn-wrap" style="flex-basis:100%;margin-top:6px">
    <button class="start-btn" id="start-btn" disabled onclick="startGame()">选择角色开始</button>
  </div>
</div>

<script>
// ─── Loading animation ───
const loadingBar = document.getElementById('loading-bar');
const loadingWalker = document.getElementById('loading-walker');
const loadingOverlay = document.getElementById('loading-overlay');
const loadingTip = document.getElementById('loading-tip');
const tips = ['正在启动数字敦煌系统……','正在校准AI识别引擎……','正在连接莫高窟数据库……','正在加载文物图鉴……','系统就绪，欢迎进入。'];
let progress = 0;

function updateLoading() {
  progress += randInt(3, 8);
  if (progress > 100) progress = 100;
  loadingBar.style.width = progress + '%';
  const pw = loadingBar.parentElement.offsetWidth;
  loadingWalker.style.left = (progress/100) * pw + 'px';

  const tipIdx = Math.min(Math.floor(progress / 22), tips.length-1);
  loadingTip.textContent = tips[tipIdx];

  if (progress < 100) {
    setTimeout(updateLoading, randInt(200, 500));
  } else {
    setTimeout(() => {
      loadingOverlay.classList.add('hidden');
      document.getElementById('index-content').style.display = 'flex';
    }, 400);
  }
}

function randInt(a,b) { return Math.floor(Math.random()*(b-a+1))+a; }

// ─── Character select ───
let selected = null;

function selectChar(c) {
  selected = c;
  document.getElementById('card-arch').classList.toggle('selected', c==='arch');
  document.getElementById('card-prog').classList.toggle('selected', c==='prog');
  const btn = document.getElementById('start-btn');
  btn.disabled = false;
  btn.className = 'start-btn ' + c;
  btn.textContent = c==='arch' ? '以考古学家身份开始' : '以程序员身份开始';
}

function startGame() {
  if (!selected) return;
  window.location.href = selected==='arch' ? 'archaeologist.html' : 'programmer.html';
}

// ─── Particles ───
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W,H, particles=[];

function resize() { W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize', resize);

for (let i=0; i<60; i++) {
  particles.push({
    x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.5+0.3,
    vx:(Math.random()-0.5)*0.3, vy:-Math.random()*0.5-0.1,
    op:Math.random()*0.5+0.1,
    col:Math.random()>0.6?'#C8963C':'#3a2a60'
  });
}

function drawParticles() {
  ctx.clearRect(0,0,W,H);
  particles.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.col; ctx.globalAlpha=p.op; ctx.fill();
    p.x+=p.vx; p.y+=p.vy;
    if(p.y<-5){p.y=H+5;p.x=Math.random()*W;}
    if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;
  });
  ctx.globalAlpha=1;
  requestAnimationFrame(drawParticles);
}
drawParticles();

// Start loading
setTimeout(updateLoading, 300);
</script>
</body>
</html>
